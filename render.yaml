services:
  - type: web
    name: aria-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: apps/api
    buildCommand: pnpm install --frozen-lockfile && npx prisma generate && pnpm build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # set these in the Render dashboard, never in this file
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: WATI_API_URL
        sync: false
      - key: WATI_ACCESS_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: info
